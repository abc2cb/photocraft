name: Camera Raw Linux test build
on:
  push:
    branches: [camera-raw-test-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: camera-raw-release
      - name: Optimized desktop with HEIF
        run: cargo build --release --locked --features heif -p photocraft
      - name: Camera Raw 24 MP quick benchmarks
        run: cargo xtask perf --quick --bench camera_raw_bench
      - name: Upload test build and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-raw-linux-test
          path: |
            target/release/photocraft
            target/perf/*.json
            target/perf/summary.md
            LICENSE*
          retention-days: 14
